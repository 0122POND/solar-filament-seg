# FINAL MODEL: NLv x full-data B6 (refiner seeds 16 / 17 / 18) + C0 + order bonus 0.10, the submission Kaggle shows as our best public score
# (public LB 0.41; CSV outputs/sub_NLv_FF6CC0_t025_ORDp10.csv, md5 540c8863..., 1,209 filaments on 178 frames; tests/test_golden_yellow.py).
# = configs/final_fullfit.yaml with two changes and nothing else:
#   refiner   the six full-data members are trained with seeds 16 / 17 / 18 (NNRP x16 / x17 / x18 + S15F x16 / x17 / x18)
#             instead of no seed / 11 / 12. Same recipe, same data (all 707 frames), same test-time inputs. With the bonus
#             below set to 0 this is sub_NLv_FF6CC0_t025.csv (md5 678c2482..., 1,210 filaments, 914 masks reset by C0, LB 0.41).
#   decode    order_bonus 0.10: for the ORDER of the decode only, 0.10 is added to yhat of the Mask DINO Swin-L candidates
#             (source 'yolo'). The acceptance test yhat > tau uses the unchanged yhat, so the same candidates enter the decode;
#             the bonus only changes which of two overlapping candidates is placed first (164 of 178 test frames change).
#             With 0.02 this is sub_NLv_FF6CC0_t025_ORDp02.csv (md5 257bb97a..., 1,209 filaments, LB 0.41), our best public
#             score on Nov 14; 0.10 was submitted on Nov 15 and replaced it (146 of 178 frames differ between the two).
# Both changes are inside the noise of our validation: retraining the fold refiners with other seeds moves the nested OOF
# PQ by SD 0.0002 (NNRP) to 0.0005 (S15F), and on the OOF of the fold version (B6 fold refiners, seeds none / 11 / 12;
# seeds 16-18 have no fold version) the bonus moves rec PQ from 0.4758 to 0.4759 (+0.0001, 3 of 5 folds up; 0.02: +0.00003).
# The two were chosen by the order on the public leaderboard among variants our validation cannot separate.
# We do not claim that this config is better than configs/final_fullfit.yaml.
#
# Stages (as configs/final_fullfit.yaml):
#   for m in FFNNRPx16 FFNNRPx17 FFNNRPx18 FFS15Fx16 FFS15Fx17 FFS15Fx18:
#     python -m filament_seg --config configs/final_yellow.yaml residual --fold -1 --member $m   -> out/refiner_$m_f-1.pt
#   python -m filament_seg --config configs/final_yellow.yaml refine-test --weights <weights> --out refined.pkl
#   python -m filament_seg --config configs/final_yellow.yaml final-cpu --out yellow.csv
#   python -m filament_seg --config configs/final_yellow.yaml final-cpu --yhat-cached --out yellow.csv   (decode + C0, under 1 min)
include: [final_fullfit.yaml]

decode:
  order_bonus: 0.10             # nlv.DECODE_KNOBS; 0 = the decode of configs/final_fullfit.yaml

refiner:
  members:                      # checkpoints relative to refine-test --weights
    - {tag: FFNNRPx16, full: true, seed: 16, checkpoints: fullfit/refiner_FFNNRPx16_f-1.pt}
    - {tag: FFNNRPx17, full: true, seed: 17, checkpoints: fullfit/refiner_FFNNRPx17_f-1.pt}
    - {tag: FFNNRPx18, full: true, seed: 18, checkpoints: fullfit/refiner_FFNNRPx18_f-1.pt}
    - {tag: FFS15Fx16, full: true, seed: 16, checkpoints: fullfit/refiner_FFS15Fx16_f-1.pt, test_feats: "s15f_test_feat_f{k}.npy", test_boxes: s15f_test_boxes.npy}
    - {tag: FFS15Fx17, full: true, seed: 17, checkpoints: fullfit/refiner_FFS15Fx17_f-1.pt, test_feats: "s15f_test_feat_f{k}.npy", test_boxes: s15f_test_boxes.npy}
    - {tag: FFS15Fx18, full: true, seed: 18, checkpoints: fullfit/refiner_FFS15Fx18_f-1.pt, test_feats: "s15f_test_feat_f{k}.npy", test_boxes: s15f_test_boxes.npy}

nlv:
  refiner_rles: ${SOLAR_ROOT}/outputs/lastpush/FF6C/refiner_FF6C_test_rles.pkl          # test masks of the six members above (before C0; refine-test)
  submitted_csv: ${SOLAR_REPO}/outputs/sub_NLv_FF6CC0_t025_ORDp10.csv                   # the final submission (in this repository)
  submitted_csv_bonus_002: ${SOLAR_ROOT}/outputs/antisym/test/sub_NLv_FF6CC0_t025_ORDp02.csv   # the same members with order_bonus 0.02
  submitted_csv_no_bonus: ${SOLAR_ROOT}/outputs/lastpush/FF6C/sub_NLv_FF6CC0_t025.csv   # the same members with order_bonus 0
